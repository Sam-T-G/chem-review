# Runs the check a person runs before calling a change done: pnpm verify
# (typecheck, lint, unit tests, repo checks, production web build).
# This workflow has never run. It runs for the first time on the first push that includes it
# (docs/roadmap.md, W-012). The browser checks are not in it yet.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the repo check compares the change with origin/main
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
